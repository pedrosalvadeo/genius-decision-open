name: Genius code evolution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'evolution/active-request.json'
      - 'evolution/requests/**'
      - 'evolution/data/**'
      - 'evolution/genius_evolution/**'
      - 'evolution/tests/**'
      - '.github/workflows/code-evolution.yml'
  pull_request:
    paths: ['evolution/**', '.github/workflows/code-evolution.yml']
permissions:
  contents: read
concurrency:
  group: genius-evolution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate generated code without network or credentials
        env:
          EVALUATED_REVISION: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/genius-evolution"
          docker run --rm --init --network none --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 \
            --memory 384m --cpus 1 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m --user "$(id -u):$(id -g)" \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/src/evolution:/src/adaptive \
            -e EVALUATED_REVISION \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/genius-evolution:/out:rw" -w /src \
            python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3 \
            sh -c 'python -B -m unittest discover -s evolution/tests -v && python -B -m genius_evolution prepare --bundle /out/bundle.json --base "$EVALUATED_REVISION"'
      - uses: actions/upload-artifact@v4
        with:
          name: genius-code-proposal
          path: ${{ runner.temp }}/genius-evolution/bundle.json
          retention-days: 7
  publish:
    needs: evaluate
    if: github.repository == 'pedrosalvadeo/genius-decision-open' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: genius-code-proposal
          path: ${{ runner.temp }}/genius-evolution
      - name: Recompute evidence before publishing the immutable branch
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: evolution:adaptive
        run: |
          python -B -m genius_evolution publish \
            --bundle "$RUNNER_TEMP/genius-evolution/bundle.json" \
            --result "$RUNNER_TEMP/genius-evolution/publication.json"
          cat "$RUNNER_TEMP/genius-evolution/publication.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genius-code-publication
          path: ${{ runner.temp }}/genius-evolution/publication.json
          retention-days: 7
