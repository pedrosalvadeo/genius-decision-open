name: Twin unit tests
on:
  push:
    paths: ['twin/**', 'kernel/**', '.github/workflows/twin-tests.yml']
  pull_request:
    paths: ['twin/**', 'kernel/**', '.github/workflows/twin-tests.yml']
permissions:
  contents: read
jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install --require-hashes -r beta/requirements.lock
      - name: Run the full twin suite, real field cases included
        working-directory: twin
        env:
          PYTHONPATH: ${{ github.workspace }}/twin:${{ github.workspace }}/kernel
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -v
