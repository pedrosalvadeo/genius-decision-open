name: Genius population node

# The living populations of routes keep evolving between observations: every day each
# population gets one more generation on its current present (variation by the learned
# proposer, selection by the kernel). It contacts no one. The state lives on the
# node-population branch, so main and the deploy change only by observation.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'twin/genius_twin/population.py'
      - 'twin/genius_twin/route_proposer.py'
      - 'twin/genius_twin/route_search.py'
      - '.github/workflows/population-node.yml'

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install --require-hashes -r beta/requirements.lock
      - name: Bring the populations grown so far
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP" && git init -q state && cd state
          git config user.name 'genius-population-node'
          git config user.email 'genius-population-node@users.noreply.github.com'
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin node-population; then git checkout -q -b node-population FETCH_HEAD; else git checkout -q --orphan node-population; fi
      - name: One generation for every population
        env:
          PYTHONPATH: ${{ github.workspace }}/twin:${{ github.workspace }}/kernel
          BATCHES: ${{ github.event_name == 'pull_request' && '1' || '6' }}
        run: |
          mkdir -p out
          for path in twin/cases/*/population.json; do
            case=$(basename "$(dirname "$path")")
            python twin/cases/predictions.py evolve "$case" --batches "$BATCHES" --state "$RUNNER_TEMP/state" > "out/$case.json"
            python -c "import json,sys; g=json.load(open(sys.argv[1])); print(sys.argv[2], 'generation', g['generation'], 'niches', g['niches'], 'born', g['born'], 'improvements', len(g['improvements']))" "out/$case.json" "$case"
          done
      - name: Publish to the node-population branch
        if: github.event_name != 'pull_request'
        run: |
          cd "$RUNNER_TEMP/state"
          git add -A
          git commit -qm "Population node run ${GITHUB_RUN_ID} from ${GITHUB_SHA}" || exit 0
          git push -q origin node-population
