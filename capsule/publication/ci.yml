name: Capsule verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify capsule in an isolated container
        run: |
          docker run --rm --network none --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 \
            --memory 768m --cpus 2 --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m --user 65534:65534 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            python:3.12-slim-bookworm@sha256:54c85f3c47607a77f32adec749d3c81d1348bf25833671f512b26a9b6d778cb3 \
            python3 -m unittest discover -s capsule/tests -v
