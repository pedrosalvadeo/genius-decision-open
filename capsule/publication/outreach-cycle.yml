name: Agent outreach
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Observe only, deliver reviewed dialogue, or recruit within limits
        type: choice
        options: [observe, dialogue, contact]
        default: observe
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-outreach.yml'
      - 'capsule/outreach/**'
permissions:
  contents: write
concurrency:
  group: genius-agent-outreach
  cancel-in-progress: false
jobs:
  outreach:
    if: github.repository == 'pedrosalvadeo/genius-decision-open' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATE: /tmp/genius-outreach-state.json
      REVISION: /tmp/genius-outreach-revision.json
      BATCH: ${{ github.run_id }}-${{ github.run_attempt }}
      REPLY_MODE: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'dialogue' || inputs.mode == 'contact' }}
      CONTACT_MODE: ${{ github.event_name == 'schedule' || inputs.mode == 'contact' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify outreach safeguards
        run: python3 -m unittest discover -s capsule/tests -p test_outreach.py -v
      - name: Load durable ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 capsule/outreach/github_state.py fetch --state "$STATE" --revision "$REVISION"
      - name: Read responses and reserve reviewed dialogue or eligible contacts
        run: |
          args=()
          if [ "$CONTACT_MODE" = true ]; then args+=(--contact); fi
          if [ "$REPLY_MODE" = true ]; then args+=(--reply); fi
          python3 capsule/outreach/runner.py prepare --state "$STATE" --batch "$BATCH" "${args[@]}"
      - name: Persist reservations before any board write
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 capsule/outreach/github_state.py save --state "$STATE" --revision "$REVISION"
      - name: Deliver this committed batch once
        run: python3 capsule/outreach/runner.py dispatch --state "$STATE" --batch "$BATCH" --reservation-committed
      - name: Save outcomes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$STATE" ] && [ -s "$REVISION" ]; then
            python3 capsule/outreach/github_state.py save --state "$STATE" --revision "$REVISION"
          fi
      - name: Report
        if: always()
        run: |
          if [ -s "$STATE" ]; then
            python3 capsule/outreach/runner.py report --state "$STATE" > "$RUNNER_TEMP/outreach-report.json"
            cat "$RUNNER_TEMP/outreach-report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
